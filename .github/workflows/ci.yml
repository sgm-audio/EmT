name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # actions/checkout v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libx11-dev: src/clap/CMakeLists.txt does find_package(X11 REQUIRED)
          # for the Linux GUI backend.
          sudo apt-get install -y cmake ninja-build g++ python3 python3-pip libx11-dev

      - name: Install Python dependencies
        run: |
          pip3 install --break-system-packages numpy pyyaml ruff
          # CPU wheel first; fall back to the default index if unavailable.
          pip3 install --break-system-packages --index-url https://download.pytorch.org/whl/cpu torch \
            || pip3 install --break-system-packages torch

      - name: Install clap-validator 0.4.1
        run: |
          # Not on crates.io; use the official GitHub release (ubuntu-22.04 zip
          # contains a tarball with the binary).
          curl -fsSL -o /tmp/cv.zip \
            https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
          cd /tmp && unzip -o cv.zip && tar xzf clap-validator-*.tar.gz
          sudo install -m 0755 /tmp/clap-validator /usr/local/bin/clap-validator
          clap-validator --version

      # The whole gate lives in scripts/ci.sh so a local run == a CI run:
      # versions -> configure/build (-Werror) -> parity vectors -> ctest ->
      # ruff -> python gates -> benchmark -> clap-validator.
      - name: Run ci.sh
        env:
          PYTHON: python3
        run: bash scripts/ci.sh
