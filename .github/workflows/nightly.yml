name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            generator: "Visual Studio 18 2026"
            config: Release
          - os: macos-latest
            generator: Xcode
            config: Release
          - os: ubuntu-latest
            generator: Ninja
            config: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . -B build/${{ matrix.config }} -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build/${{ matrix.config }} --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build/${{ matrix.config }} --output-on-failure --build-config ${{ matrix.config }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: build/${{ matrix.config }}/Testing/Temporary/

  package:
    name: Package
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (Linux)
        run: |
          cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Release --config Release --parallel

      - name: Package CLAP bundle
        run: ./scripts/package.sh build/Release

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "Nightly ${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: dist/Linux/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}