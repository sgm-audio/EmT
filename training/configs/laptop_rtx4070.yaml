# RTX 4070 Laptop (8 GB VRAM) — conservative Mamba-3 config.
#
# Target: train a small autoregressive raw-waveform model that still fits the
# plugin's real-time budget after export.  Estimated VRAM ~5 GB at batch_size=4.
# Reduce batch_size or seq_len if you see OOM.

# Architecture
# ------------
d_state: 16
d_model: 1          # scalar raw audio; use larger for latent tokens
d_inner: 64
nheads: 2
headdim: 32
num_layers: 3
mimo_rank: 1
cond_dim: 32       # small FiLM vector for pitch/velocity/one-hot instrument

# Training
# --------
batch_size: 4
seq_len: 2048
sample_rate: 44100
epochs: 20
lr: 1.0e-3
weight_decay: 0.01
betas: [0.9, 0.999]
grad_accum: 2       # effective batch = 8
optimizer: adamw
scheduler: cosine
warmup_steps: 500
save_every: 1000
seed: 42

# Performance
# -----------
amp: true           # torch.cuda.amp fp16
num_workers: 0      # Windows/Python multiprocessing can be flaky; set 0 to debug
